<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Negar ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        padding: 25px;
        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at 15% 15%, rgba(255,255,255,.85), transparent 25%),
            radial-gradient(circle at 85% 85%, rgba(220,205,235,.5), transparent 30%),
            #f4eff7;

        font-family: Georgia, "Times New Roman", serif;
        color: #514957;
        overflow-x: hidden;
    }

    .page {
        width: 100%;
        max-width: 650px;
        min-height: 650px;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
    }

    .decor {
        position: absolute;
        color: #b6a6c1;
        font-size: 23px;
        opacity: .65;

        animation: float 4s ease-in-out infinite;
        user-select: none;
    }

    .d1 {
        top: 9%;
        left: 8%;
    }

    .d2 {
        top: 17%;
        right: 9%;
        animation-delay: 1s;
    }

    .d3 {
        bottom: 13%;
        left: 10%;
        animation-delay: 1.7s;
    }

    .d4 {
        bottom: 17%;
        right: 8%;
        animation-delay: .6s;
    }

    .d5 {
        top: 45%;
        left: 2%;
        animation-delay: 2s;
    }

    .d6 {
        top: 50%;
        right: 2%;
        animation-delay: 1.3s;
    }

    .card {
        width: min(92%, 480px);

        padding: 48px 30px;

        text-align: center;

        background: rgba(255,255,255,.74);

        border: 1px solid rgba(255,255,255,.9);

        border-radius: 32px;

        box-shadow:
            0 25px 70px rgba(75,60,85,.13),
            inset 0 1px 0 rgba(255,255,255,.9);

        backdrop-filter: blur(12px);

        position: relative;
        z-index: 2;
    }

    .top {
        font-size: 14px;
        letter-spacing: 3px;
        color: #9b8da4;
        text-transform: uppercase;
        margin-bottom: 22px;
    }

    .gift {
        font-size: 58px;
        margin-bottom: 15px;

        animation: gentle 2.5s ease-in-out infinite;
    }

    h1 {
        margin: 0;

        font-size: clamp(30px, 7vw, 43px);

        font-weight: normal;

        color: #554b5d;

        line-height: 1.35;
    }

    .line {
        width: 70px;
        height: 1px;

        background: #b9a8c4;

        margin: 24px auto;
    }

    .text {
        font-size: 17px;
        line-height: 2;

        color: #706675;

        margin: 0 auto 25px;
    }

    .birthday-date {
        display: inline-block;

        padding: 12px 23px;

        border-radius: 16px;

        background: rgba(225,214,231,.65);

        color: #716477;

        font-size: 16px;

        margin-bottom: 27px;
    }

    .little-note {
        font-size: 14px;

        line-height: 1.9;

        color: #9a909f;

        margin-bottom: 28px;
    }
