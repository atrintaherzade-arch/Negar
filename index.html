<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ Happy Birthday Negar ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
            radial-gradient(circle at 80% 80%, rgba(220,205,235,.45), transparent 30%),
            #f4eff7;
        font-family: Georgia, "Times New Roman", serif;
        color: #4d4652;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        padding: 25px;
    }

    .page {
        width: 100%;
        max-width: 650px;
        min-height: 650px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .decor {
        position: absolute;
        font-size: 22px;
        opacity: .65;
        animation: float 4s ease-in-out infinite;
        user-select: none;
    }

    .d1 { top: 8%; left: 8%; animation-delay: .2s; }
    .d2 { top: 15%; right: 10%; animation-delay: 1s; }
    .d3 { bottom: 12%; left: 12%; animation-delay: 1.7s; }
    .d4 { bottom: 18%; right: 8%; animation-delay: .7s; }
    .d5 { top: 42%; left: 2%; animation-delay: 2s; }
    .d6 { top: 48%; right: 3%; animation-delay: 1.3s; }

    .card {
        width: min(92%, 470px);
        padding: 55px 32px;
        text-align: center;
        background: rgba(255,255,255,.72);
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 32px;
        box-shadow:
            0 25px 70px rgba(75,60,85,.13),
            inset 0 1px 0 rgba(255,255,255,.9);
        backdrop-filter: blur(12px);
        position: relative;
        z-index: 2;
    }

    .small {
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #9a8da4;
        margin-bottom: 20px;
    }

    h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 52px);
        line-height: 1.25;
        font-weight: normal;
        color: #554b5d;
    }

    .line {
        width: 75px;
        height: 1px;
        background: #b9a8c4;
        margin: 25px auto;
    }

    .message {
        font-size: 18px;
        line-height: 1.9;
        color: #706675;
        margin-bottom: 32px;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    button,
    a {
        font-family: inherit;
    }

    .main-button {
        border: none;
        background: #bca9c7;
        color: white;
        padding: 14px 30px;
        border-radius: 16px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        transition: .25s ease;
        box-shadow: 0 8px 20px rgba(100,80,110,.12);
    }

    .main-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(100,80,110,.18);
    }

    .music {
        margin-top: 25px;
        padding-top: 18px;
        border-top: 1px solid rgba(160,145,170,.25);
        color: #aaa0b0;
        font-size: 13px;
    }

    .secret {
        margin-top: 18px;
    }

    .secret button {
        background: transparent;
        border: none;
        color: #9d91a5;
        font-size: 13px;
        cursor: pointer;
        padding: 8px;
    }

    .secret-box {
        display: none;
        margin-top: 12px;
        padding: 15px;
        border-radius: 14px;
        background: rgba(240,234,244,.8);
        color: #756b7c;
        font-size: 14px;
        line-height: 1.8;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-9px);
        }
    }

    @media (max-width: 500px) {
        .page {
            min-height: 600px;
        }

        .card {
            padding: 45px 23px;
        }

        .decor {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <div class="decor d1">♡</div>
    <div class="decor d2">✦</div>
    <div class="decor d3">♡</div>
    <div class="decor d4">✧</div>
    <div class="decor d5">·</div>
    <div class="decor d6">♡</div>

    <main class="card">

        <div class="small">a little page for you</div>

        <h1>♡ Happy Birthday Negar ♡</h1>

        <div class="line"></div>

        <div class="message">
            For a very special day,<br>
            made just for you ♡
        </div>

        <div class="buttons">
            <a class="main-button" href="birthday2.html">
                open your surprise ♡
            </a>
        </div>

        <div class="music">
            ♪ Music — coming soon
        </div>

        <div class="secret">
            <button onclick="showSecret()">
                ♡ secret
            </button>

            <div class="secret-box" id="secretBox">
                Something special is waiting here... ✦
            </div>
        </div>

    </main>

</div>

<script>
    function showSecret() {
        const box = document.getElementById("secretBox");

        if (box.style.display === "block") {
            box.style.display = "none";
        } else {
            box.style.display = "block";
        }
    }
</script>

</body>
</html>
